name: LocalGloss CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare toolchain and dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          bash scripts/dev.sh cargo fetch --locked
      - name: Format, lint and Rust tests
        run: |
          bash scripts/dev.sh check
          bash scripts/dev.sh cargo test --offline --locked --workspace
      - name: Settings, data and privacy tests
        run: |
          bash scripts/test-settings.sh
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/prepare-release-data.py
          bash scripts/dev.sh cargo run --offline --locked -p localgloss-engine --example offline_check -- assets/cedict/generated
          bash scripts/dev.sh cargo run --offline --locked -p localgloss-engine --example ranking_check -- assets/cedict/generated
          python3 scripts/verify-privacy.py
